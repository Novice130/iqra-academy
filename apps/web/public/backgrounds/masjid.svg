<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Dusk skyline with a dome and minarets, rendered as silhouettes so it
       reads instantly at thumbnail size and never competes with the speaker. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16213f"/>
      <stop offset="45%" stop-color="#3b3a6b"/>
      <stop offset="75%" stop-color="#8a5a72"/>
      <stop offset="100%" stop-color="#d98f63"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1a33"/>
      <stop offset="100%" stop-color="#0d0c1c"/>
    </linearGradient>
    <radialGradient id="moon" cx="22%" cy="22%" r="10%">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="60%" stop-color="#fff6e0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="hazefx" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="282" cy="158" r="34" fill="#fff6e0" opacity=".9"/>
  <rect width="1280" height="720" fill="url(#moon)"/>

  <g fill="#fff" opacity=".55">
    <circle cx="120" cy="90" r="2"/><circle cx="420" cy="70" r="1.6"/>
    <circle cx="640" cy="120" r="2.2"/><circle cx="880" cy="60" r="1.8"/>
    <circle cx="1060" cy="140" r="2"/><circle cx="1180" cy="80" r="1.5"/>
    <circle cx="520" cy="180" r="1.4"/><circle cx="980" cy="200" r="1.6"/>
  </g>

  <!-- Distant haze band so the silhouettes sit in atmosphere -->
  <rect x="0" y="430" width="1280" height="90" fill="#d98f63" opacity=".35" filter="url(#hazefx)"/>

  <g fill="url(#silhouette)">
    <!-- Main dome + drum -->
    <path d="M520 520 L520 430 A120 110 0 0 1 760 430 L760 520 Z"/>
    <path d="M640 300 q-16 20 0 34 q16-14 0-34"/>
    <!-- Minarets -->
    <rect x="420" y="300" width="34" height="220" rx="6"/>
    <path d="M420 300 h34 l-17-42 Z"/>
    <rect x="826" y="300" width="34" height="220" rx="6"/>
    <path d="M826 300 h34 l-17-42 Z"/>
    <!-- Arcade wall -->
    <rect x="180" y="470" width="920" height="50"/>
    <rect x="0" y="520" width="1280" height="200"/>
  </g>

  <g fill="#f6c98f" opacity=".5">
    <rect x="560" y="486" width="18" height="28" rx="8"/>
    <rect x="632" y="486" width="18" height="28" rx="8"/>
    <rect x="704" y="486" width="18" height="28" rx="8"/>
  </g>
</svg>
