<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Warm study library. Books are a repeated pattern, but kept large and
       softly blurred on purpose: at real thumbnail size a fine repeat reads
       as a barcode rather than a bookcase. -->
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1e"/>
      <stop offset="100%" stop-color="#1c130d"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5636"/>
      <stop offset="100%" stop-color="#4a3220"/>
    </linearGradient>
    <pattern id="books" width="268" height="176" patternUnits="userSpaceOnUse">
      <rect width="268" height="176" fill="#241811"/>
      <rect x="10"  y="26" width="34" height="140" rx="4" fill="#7e332c"/>
      <rect x="50"  y="40" width="26" height="126" rx="4" fill="#b4924c"/>
      <rect x="82"  y="20" width="38" height="146" rx="4" fill="#345b49"/>
      <rect x="126" y="46" width="24" height="120" rx="4" fill="#93551f"/>
      <rect x="156" y="30" width="32" height="136" rx="4" fill="#3f4f72"/>
      <rect x="194" y="44" width="28" height="122" rx="4" fill="#6b3f5c"/>
      <rect x="228" y="24" width="30" height="142" rx="4" fill="#7f6224"/>
      <!-- faint spine highlights so the blocks don't read as flat bars -->
      <g fill="#fff" opacity=".08">
        <rect x="14"  y="40" width="26" height="6"/>
        <rect x="86"  y="34" width="30" height="6"/>
        <rect x="160" y="44" width="24" height="6"/>
        <rect x="232" y="38" width="22" height="6"/>
      </g>
    </pattern>
    <radialGradient id="lamp" cx="74%" cy="60%" r="52%">
      <stop offset="0%" stop-color="#ffca85" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffca85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="50%" cy="50%" r="68%">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".62"/>
    </radialGradient>
    <filter id="soften" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#room)"/>

  <g filter="url(#soften)">
    <rect x="70" y="40" width="1140" height="640" fill="url(#books)"/>
    <g fill="url(#shelf)">
      <rect x="60" y="204" width="1160" height="20" rx="4"/>
      <rect x="60" y="380" width="1160" height="20" rx="4"/>
      <rect x="60" y="556" width="1160" height="20" rx="4"/>
      <rect x="60" y="26"  width="1160" height="22" rx="4"/>
      <rect x="50" y="26"  width="26" height="654"/>
      <rect x="1204" y="26" width="26" height="654"/>
    </g>
  </g>

  <rect width="1280" height="720" fill="url(#lamp)"/>
  <rect width="1280" height="720" fill="url(#vig2)"/>
</svg>
