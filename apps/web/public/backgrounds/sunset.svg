<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Calm sea at sunset. Pure gradient work, no hard edges — the cheapest
       background to segment against and the least distracting. -->
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a6b"/>
      <stop offset="38%" stop-color="#8a6a9c"/>
      <stop offset="66%" stop-color="#e08a63"/>
      <stop offset="100%" stop-color="#f7c98b"/>
    </linearGradient>
    <linearGradient id="ssea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9895f"/>
      <stop offset="30%" stop-color="#6b5a86"/>
      <stop offset="100%" stop-color="#22284d"/>
    </linearGradient>
    <radialGradient id="ssun" cx="50%" cy="60%" r="20%">
      <stop offset="0%" stop-color="#fff2cf"/>
      <stop offset="45%" stop-color="#ffd79a" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sblur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ssky)"/>
  <circle cx="640" cy="432" r="62" fill="#fff0c9"/>
  <rect width="1280" height="720" fill="url(#ssun)"/>
  <rect y="432" width="1280" height="288" fill="url(#ssea)"/>

  <g fill="#ffe6b8" opacity=".35" filter="url(#sblur)">
    <rect x="560" y="470" width="160" height="8" rx="4"/>
    <rect x="520" y="510" width="240" height="9" rx="4"/>
    <rect x="470" y="556" width="340" height="10" rx="5"/>
    <rect x="410" y="608" width="460" height="11" rx="5"/>
    <rect x="330" y="666" width="620" height="12" rx="6"/>
  </g>
</svg>
