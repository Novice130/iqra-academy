<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Sandstone arcade opening onto a lit courtyard. The daylight comes
       through an arch-shaped opening rather than a rectangle — a hard bright
       rectangle in the middle of the frame is the giveaway that it's a
       drawing rather than a room. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a97f"/>
      <stop offset="55%" stop-color="#ac8a5f"/>
      <stop offset="100%" stop-color="#7e6242"/>
    </linearGradient>
    <linearGradient id="daylight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e2"/>
      <stop offset="60%" stop-color="#f3d7a8"/>
      <stop offset="100%" stop-color="#d9b078"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6c4a"/>
      <stop offset="100%" stop-color="#3f2f20"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#fff1d2" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#fff1d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- Pointed arch opening, reused at three depths. -->
    <path id="arch" d="M0 340 L0 150 Q80 20 160 150 L160 340 Z"/>
  </defs>

  <rect width="1280" height="720" fill="url(#wall)"/>

  <!-- Courtyard glimpsed through the far arch -->
  <g>
    <use href="#arch" transform="translate(560 200) scale(1.0)" fill="url(#daylight)"/>
    <g filter="url(#soft)">
      <circle cx="640" cy="430" r="46" fill="#cbbf94" opacity=".8"/>
      <rect x="560" y="470" width="160" height="70" fill="#b79b6e" opacity=".75"/>
    </g>
  </g>

  <!-- Colonnade: piers get darker and larger as they come forward -->
  <g fill="#9c7a53">
    <use href="#arch" transform="translate(360 180) scale(1.15)"/>
    <use href="#arch" transform="translate(736 180) scale(1.15)"/>
  </g>
  <g fill="#7c5e3d">
    <use href="#arch" transform="translate(150 140) scale(1.45)"/>
    <use href="#arch" transform="translate(898 140) scale(1.45)"/>
  </g>
  <g fill="#5d442b">
    <use href="#arch" transform="translate(-90 90) scale(1.8)"/>
    <use href="#arch" transform="translate(1082 90) scale(1.8)"/>
  </g>

  <!-- Floor and the pool of light spilling out of the courtyard -->
  <rect y="536" width="1280" height="184" fill="url(#floor)"/>
  <ellipse cx="640" cy="600" rx="230" ry="46" fill="#f6dcae" opacity=".28" filter="url(#soft)"/>

  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#vig)"/>
</svg>
