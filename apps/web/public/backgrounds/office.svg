<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Neutral modern office: the safe, professional option. Glass partition,
       soft daylight, one plant. Nothing here should pull the eye. -->
  <defs>
    <linearGradient id="owall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e9ee"/>
      <stop offset="100%" stop-color="#aeb6bf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbe7ef" stop-opacity=".95"/>
      <stop offset="50%" stop-color="#c3d4e0" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#aebfcd" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="daylight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="oblur" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="ovig" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".3"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#owall)"/>

  <g filter="url(#oblur)">
    <!-- Glass partition, right two thirds -->
    <rect x="560" y="40" width="680" height="600" rx="6" fill="url(#glass)"/>
    <g fill="#f4f8fb" opacity=".9">
      <rect x="770" y="40" width="10" height="600"/>
      <rect x="980" y="40" width="10" height="600"/>
      <rect x="560" y="330" width="680" height="10"/>
    </g>
    <rect x="552" y="32" width="8" height="616" fill="#9aa7b3"/>

    <!-- Acoustic panels, left -->
    <g fill="#b9c2cb">
      <rect x="70" y="120" width="150" height="220" rx="8"/>
      <rect x="240" y="170" width="150" height="220" rx="8"/>
      <rect x="70" y="360" width="150" height="180" rx="8" opacity=".7"/>
    </g>

    <!-- Desk edge, low in frame, to give the room a floor -->
    <rect x="0" y="612" width="1280" height="18" rx="4" fill="#8d939a" opacity=".8"/>
    <rect x="0" y="630" width="1280" height="90" fill="#9aa1a9" opacity=".55"/>

    <!-- Plant -->
    <path d="M300 720 q-20-150 14-220 q34 70 14 220 Z" fill="#4e7a53"/>
    <path d="M314 520 q56-40 104 6 q-66 30-104-6 Z" fill="#5f8f60"/>
    <path d="M314 562 q-66-34-108 18 q70 24 108-18 Z" fill="#446b4a"/>
    <rect x="266" y="646" width="96" height="74" rx="10" fill="#8b8f95"/>
  </g>

  <rect width="1280" height="720" fill="url(#daylight)"/>
  <rect width="1280" height="720" fill="url(#ovig)"/>
</svg>
