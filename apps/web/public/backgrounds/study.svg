<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Quiet home study: painted wall, window light from the left, a shelf
       and a plant. Deliberately low-contrast so a face in front of it stays
       the brightest thing in frame. -->
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e2d6"/>
      <stop offset="60%" stop-color="#d3ccbd"/>
      <stop offset="100%" stop-color="#b3ab9b"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#fffaf0" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#fffaf0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#fffaf0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7247"/>
      <stop offset="100%" stop-color="#70502f"/>
    </linearGradient>
    <filter id="blur3" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig3" cx="50%" cy="48%" r="70%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#wall2)"/>

  <g filter="url(#blur3)">
    <!-- Window, left third -->
    <rect x="70" y="70" width="300" height="380" rx="8" fill="#f6f2e6"/>
    <rect x="86" y="86" width="268" height="348" rx="4" fill="#cfe3ec"/>
    <rect x="214" y="86" width="12" height="348" fill="#f6f2e6"/>
    <rect x="86" y="252" width="268" height="12" fill="#f6f2e6"/>
    <rect x="60" y="450" width="320" height="16" rx="4" fill="url(#wood)"/>

    <!-- Floating shelf with a few objects, right -->
    <rect x="820" y="300" width="380" height="14" rx="4" fill="url(#wood)"/>
    <rect x="860" y="238" width="20" height="62" rx="3" fill="#7d4a4a"/>
    <rect x="884" y="248" width="16" height="52" rx="3" fill="#3f6b58"/>
    <rect x="904" y="242" width="22" height="58" rx="3" fill="#c2a15a"/>
    <rect x="1080" y="252" width="70" height="48" rx="6" fill="#a58a63"/>

    <!-- Plant, bottom right -->
    <path d="M1130 720 q-30-160 20-250 q40 90 20 250 Z" fill="#4e7a53"/>
    <path d="M1150 500 q60-40 110 10 q-70 30-110-10 Z" fill="#5f8f60"/>
    <path d="M1150 545 q-70-35-115 20 q75 25 115-20 Z" fill="#446b4a"/>
    <rect x="1100" y="640" width="120" height="80" rx="10" fill="#8d6a4b"/>
  </g>

  <rect width="1280" height="720" fill="url(#light)"/>
  <rect width="1280" height="720" fill="url(#vig3)"/>
</svg>
