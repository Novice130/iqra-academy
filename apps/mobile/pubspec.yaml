name: novice_tutor
description: Novice Tutor — Quran learning, on Android and iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# The app is a shell around the web app (see docs/mobile-app.md): one WebView,
# plus push. Anything the web app already does stays in the web app, so this
# list is deliberately short. The earlier native-screen draft lives in
# `legacy/lib/` — it is not compiled.
dependencies:
  flutter:
    sdk: flutter

  # The app itself
  flutter_inappwebview: ^6.1.5

  # Links that must not open inside the WebView (Google OAuth, Stripe)
  url_launcher: ^6.3.1

  # Android runtime permissions. The WebView's own onPermissionRequest only
  # answers the *web* prompt — without the OS grant behind it, getUserMedia
  # fails and the call screen's camera and mic buttons do nothing at all.
  permission_handler: ^11.3.1

  # Native Google sign-in. Google refuses OAuth inside a WebView
  # ("disallowed_useragent"), so the web page's Google button is intercepted
  # and this runs instead. Pinned to 6.x — 7.0 rewrote the whole API.
  google_sign_in: ^6.2.2

  # Push while the app is closed — the reason this app exists
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1

  # The full-screen incoming call: ringtone, Accept/Decline, over the lock
  # screen. A notification cannot do this; a teacher ringing a student has to
  # behave like a phone call.
  flutter_callkit_incoming: ^2.5.2

  # Screen sharing, and the one place the shell does more than host a page.
  # Android's WebView has no getDisplayMedia at all, so presenting from the
  # app cannot go through the web call screen: the shell captures the screen
  # itself and joins the same LiveKit room to publish it. flutter_webrtc is a
  # transitive dependency of livekit_client, named here because
  # `Helper.requestCapturePermission` is called directly.
  livekit_client: ^2.10.0
  flutter_webrtc: ^1.6.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/images/logo.png
