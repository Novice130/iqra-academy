<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Choose what to share</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #1a1b1e;
        color: #e8eaed;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header { padding: 16px 20px 8px; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .tabs { display: flex; gap: 4px; padding: 8px 20px 0; }
      .tab {
        appearance: none;
        border: 0;
        background: transparent;
        color: rgba(232, 234, 237, 0.6);
        font: inherit;
        font-size: 13px;
        padding: 8px 12px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      .tab[aria-selected="true"] { color: #8ab4f8; border-bottom-color: #8ab4f8; }
      main { flex: 1; overflow-y: auto; padding: 16px 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      .source {
        appearance: none;
        border: 2px solid transparent;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .source:hover { background: rgba(255, 255, 255, 0.09); }
      .source[aria-pressed="true"] { border-color: #8ab4f8; background: rgba(138, 180, 248, 0.14); }
      .source img.thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: contain;
        background: #101114;
        border-radius: 6px;
      }
      .label { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .label img { width: 16px; height: 16px; flex: none; }
      .label span {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty { color: rgba(232, 234, 237, 0.5); font-size: 13px; padding: 24px 0; }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      footer label { font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .spacer { flex: 1; }
      button.action {
        appearance: none;
        font: inherit;
        font-size: 13px;
        border-radius: 8px;
        padding: 8px 18px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: transparent;
        color: #e8eaed;
      }
      button.action.primary { background: #8ab4f8; border-color: #8ab4f8; color: #101114; font-weight: 600; }
      button.action:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <header><h1>Choose what to share</h1></header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-kind="screen" aria-selected="true">Entire screen</button>
      <button class="tab" role="tab" data-kind="window" aria-selected="false">Window</button>
    </div>
    <main><div class="grid" id="grid"></div></main>
    <footer>
      <label id="audio-row"><input type="checkbox" id="audio" /> Share system audio</label>
      <div class="spacer"></div>
      <button class="action" id="cancel">Cancel</button>
      <button class="action primary" id="share" disabled>Share</button>
    </footer>
    <script src="picker.js"></script>
  </body>
</html>
