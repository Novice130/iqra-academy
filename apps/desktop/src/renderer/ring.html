<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Incoming call</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: linear-gradient(160deg, #14161a, #0c0d10);
        color: #e8eaed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        /* The window is frameless, so the whole background is the drag handle
           and only the controls opt back out. */
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
      }
      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        font-size: 38px;
        /* Light, like a phone's own call screen — a bold initial in a small
           circle reads as a badge, not as a person. */
        font-weight: 300;
        color: rgba(255, 255, 255, 0.92);
      }
      /* Two rings, offset, so there is always one mid-flight. */
      .pulse, .pulse::after {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.28);
        animation: pulse 1.8s ease-out infinite;
      }
      .pulse::after { content: ''; inset: -2px; animation-delay: 0.9s; }
      @keyframes pulse {
        from { transform: scale(1); opacity: 0.7; }
        to { transform: scale(1.7); opacity: 0; }
      }
      .avatar-wrap { position: relative; display: grid; place-items: center; }
      .caller { font-size: 26px; font-weight: 400; text-align: center; letter-spacing: -0.01em; }
      .sub { font-size: 14px; color: rgba(232, 234, 237, 0.6); margin-top: -12px; }
      .actions {
        display: flex;
        /* Apart, not adjacent: Decline should never be a slipped click away
           from Accept. */
        justify-content: space-between;
        width: 100%;
        max-width: 260px;
        margin-top: 4px;
        -webkit-app-region: no-drag;
      }
      .action { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .action span { font-size: 13px; color: rgba(232, 234, 237, 0.85); }
      button {
        appearance: none;
        border: 0;
        font: inherit;
        color: #fff;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        transition: filter 0.15s ease;
      }
      button:hover { filter: brightness(1.12); }
      button svg { width: 28px; height: 28px; fill: currentColor; }
      /* Apple's own call colours — the two everyone already reads without
         thinking. */
      .accept { background: #34c759; animation: nudge 1.6s ease-in-out infinite; }
      .decline { background: #ff3b30; }
      @keyframes nudge {
        0%, 62%, 100% { transform: translateY(0); }
        70% { transform: translateY(-6px); }
        82% { transform: translateY(0); }
        90% { transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse::after { animation: none; opacity: 0; }
        .accept { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="avatar-wrap">
      <div class="pulse"></div>
      <div class="avatar" id="initial">?</div>
    </div>
    <div class="caller" id="caller">Incoming call</div>
    <div class="sub">Novice Tutor</div>
    <div class="actions">
      <div class="action">
        <button class="decline" id="decline" aria-label="Decline">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z" />
          </svg>
        </button>
        <span>Decline</span>
      </div>
      <div class="action">
        <button class="accept" id="accept" aria-label="Join">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
          </svg>
        </button>
        <span>Join</span>
      </div>
    </div>
    <script src="ring.js"></script>
  </body>
</html>
