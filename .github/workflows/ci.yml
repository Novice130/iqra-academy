name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  web-quality-and-tests:
    name: Web Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Web App (tsc)
        run: cd apps/web && npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Database Migration Drift & Integrity Check
        run: |
          cd apps/web
          # Verify Drizzle migrations can be inspected without uncommitted schema changes (hard failure on drift)
          npx drizzle-kit check
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

      - name: Push Database Schema to Test Postgres
        run: |
          cd apps/web
          npx drizzle-kit push --force
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          ALLOW_LOCAL_DB_SCRIPTS: "1"

      - name: Build Web App
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          BETTER_AUTH_SECRET: "dummy-secret-for-build-and-lint-validation-32chars"
          NEXT_PUBLIC_APP_URL: "https://novicetutor.com"
          NODE_ENV: "production"

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright API Tests
        run: npm run test:api
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          ALLOW_LOCAL_DB_SCRIPTS: "1"
          REALTIME_SECRET: "ci-realtime-secret-32-chars-long-min"
          BETTER_AUTH_SECRET: "dummy-secret-for-build-and-lint-validation-32chars"

      - name: Run Playwright E2E Browser Tests
        run: npm run test:e2e
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          ALLOW_LOCAL_DB_SCRIPTS: "1"
          REALTIME_SECRET: "ci-realtime-secret-32-chars-long-min"
          BETTER_AUTH_SECRET: "dummy-secret-for-build-and-lint-validation-32chars"

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  mobile-android:
    name: Mobile Android Analyze, Test & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze

      - name: Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build Android Debug APK
        run: |
          cd apps/mobile
          flutter build apk --debug

  mobile-ios:
    name: Mobile iOS Analyze, Test & Simulator Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze

      - name: Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build iOS Simulator (no codesign)
        run: |
          cd apps/mobile
          flutter build ios --simulator --no-codesign

  ci-gate:
    name: CI Security & Parity Gate
    runs-on: ubuntu-latest
    needs: [web-quality-and-tests, mobile-android, mobile-ios]
    if: always()
    steps:
      - name: Verify All Quality Gates Passed
        run: |
          if [ "${{ needs.web-quality-and-tests.result }}" != "success" ]; then
            echo "❌ web-quality-and-tests failed"
            exit 1
          fi
          if [ "${{ needs.mobile-android.result }}" != "success" ]; then
            echo "❌ mobile-android failed"
            exit 1
          fi
          if [ "${{ needs.mobile-ios.result }}" != "success" ]; then
            echo "❌ mobile-ios failed"
            exit 1
          fi
          echo "✅ All CI quality, security, and parity gates passed successfully!"

  # ── Production deploy ──────────────────────────────────────────────────────
  # Builds the image, boots it in the runner, and only then ships it to the
  # VPS. Runs on a push to master, after the web job is green, and only
  # once the repository variable DEPLOY_ENABLED is set to "true" — so merging
  # this workflow before the server exists does nothing.
  #
  # Repository variables:  DEPLOY_ENABLED, DEPLOY_PLATFORM (linux/amd64 default;
  #                        linux/arm64 for Hetzner CAX), DEPLOY_RUNNER (optional),
  #                        NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_VAPID_PUBLIC_KEY
  # Repository secrets:    DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
  #                        DEPLOY_KNOWN_HOSTS (optional, recommended)
  # Runbook: docs/deploy-vps.md
  deploy:
    name: Build Image & Deploy to VPS
    needs: [web-quality-and-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/novice130/iqra-academy
      PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only does work when PLATFORM differs from the runner's architecture
      # (an arm64 image on the default amd64 runner). Emulated builds are slow;
      # set DEPLOY_RUNNER to an arm64 runner label to avoid that.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://novicetutor.com' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image that was just built, started the way compose starts it.
      # Verifies both web and realtime processes boot, connect to the database,
      # listen and route.
      - name: Smoke-boot the image
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=user -e POSTGRES_PASSWORD=pass -e POSTGRES_DB=db \
            postgres:17-alpine
          common=(--network smoke --init --platform "$PLATFORM"
            -e DATABASE_URL=postgresql://user:pass@smoke-db:5432/db
            -e BETTER_AUTH_SECRET=smoke-test-secret-not-used-anywhere-32chars
            -e REALTIME_SECRET=smoke-realtime-secret-32-chars-long-min
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000)
          docker run -d --name web "${common[@]}" \
            -e REALTIME_INTERNAL_URL=http://realtime:8787 \
            -p 127.0.0.1:3000:3000 "$IMAGE:$GITHUB_SHA"
          docker run -d --name realtime "${common[@]}" \
            -e APP_INTERNAL_URL=http://web:3000 \
            -p 127.0.0.1:8787:8787 "$IMAGE:$GITHUB_SHA" node realtime-server.mjs

          wait_for() {
            for _ in $(seq 1 40); do
              code=$(curl -s -o /tmp/smoke-body -w '%{http_code}' "$1" || true)
              if [ "$code" = "200" ]; then echo "OK $1"; cat /tmp/smoke-body; echo; return 0; fi
              sleep 3
            done
            echo "FAILED $1 (last status: ${code:-none})"
            return 1
          }
          wait_for http://127.0.0.1:8787/healthz
          wait_for http://127.0.0.1:3000/api/health
          wait_for http://127.0.0.1:3000/login

          # The image must not run as root.
          test "$(docker exec web id -u)" != "0"

      - name: Smoke-boot logs
        if: failure()
        run: |
          docker logs web || true
          docker logs realtime || true

      - name: Push image (sha + latest)
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      # deploy.sh pulls the sha tag, waits for health, and puts the previous
      # tag back by itself if the new one does not come up.
      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?secret DEPLOY_HOST is not set}"
          : "${DEPLOY_USER:?secret DEPLOY_USER is not set}"
          : "${DEPLOY_SSH_KEY:?secret DEPLOY_SSH_KEY is not set}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key seen on this run."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"

          ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "$target" 'mkdir -p /opt/novicetutor/caddy'
          scp "${ssh_opts[@]}" -P "$DEPLOY_PORT" deploy/docker-compose.yml deploy/deploy.sh "$target:/opt/novicetutor/"
          scp "${ssh_opts[@]}" -P "$DEPLOY_PORT" deploy/caddy/Caddyfile "$target:/opt/novicetutor/caddy/Caddyfile"

          # The token is short-lived and goes over stdin, never onto a command line.
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "$target" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          ssh "${ssh_opts[@]}" -p "$DEPLOY_PORT" "$target" \
            "chmod +x /opt/novicetutor/deploy.sh && /opt/novicetutor/deploy.sh '$GITHUB_SHA'"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
