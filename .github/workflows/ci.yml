name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Runs everything and builds and pushes the image for the chosen branch, for
  # testing a branch on the server before it is merged:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: Web Lint, Typecheck & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Web App (tsc)
        run: cd apps/web && npx tsc --noEmit

      # Not `npm run lint`: that also runs the mobile workspace's
      # `flutter analyze`, and Flutter is only installed in the mobile jobs
      # (which run the analysis themselves).
      - name: Run ESLint
        run: npx turbo run lint --filter=web --filter=desktop

      - name: Database Migration Drift & Integrity Check
        run: |
          cd apps/web
          # Verify Drizzle migrations can be inspected without uncommitted schema changes (hard failure on drift)
          npx drizzle-kit check
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

      # Not `npm run build`: that also runs the mobile workspace's
      # `flutter build apk`, and Flutter is only installed in the mobile jobs.
      - name: Build Web App
        run: npx turbo run build --filter=web
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          BETTER_AUTH_SECRET: "dummy-secret-for-build-and-lint-validation-32chars"
          NEXT_PUBLIC_APP_URL: "https://novicetutor.com"
          NODE_ENV: "production"

  # Separate from web-quality so a red test run is visible on its own and does
  # not decide whether the image job runs. Playwright starts its own dev
  # server, so no build is needed here.
  web-tests:
    name: Web API & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Push Database Schema to Test Postgres
        run: |
          cd apps/web
          npx drizzle-kit push --force
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          ALLOW_LOCAL_DB_SCRIPTS: "1"

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright API Tests
        run: npm run test:api
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          ALLOW_LOCAL_DB_SCRIPTS: "1"
          REALTIME_SECRET: "ci-realtime-secret-32-chars-long-min"
          BETTER_AUTH_SECRET: "dummy-secret-for-build-and-lint-validation-32chars"

      - name: Run Playwright E2E Browser Tests
        run: npm run test:e2e
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          ALLOW_LOCAL_DB_SCRIPTS: "1"
          REALTIME_SECRET: "ci-realtime-secret-32-chars-long-min"
          BETTER_AUTH_SECRET: "dummy-secret-for-build-and-lint-validation-32chars"

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  mobile-android:
    name: Mobile Android Analyze, Test & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze

      - name: Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build Android Debug APK
        run: |
          cd apps/mobile
          flutter build apk --debug

  mobile-ios:
    name: Mobile iOS Analyze, Test & Simulator Build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Flutter Static Analysis
        run: |
          cd apps/mobile
          flutter analyze

      - name: Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build iOS Simulator (no codesign)
        run: |
          cd apps/mobile
          flutter build ios --simulator --no-codesign

  ci-gate:
    name: CI Security & Parity Gate
    runs-on: ubuntu-latest
    needs: [web-quality, web-tests, mobile-android, mobile-ios]
    if: always()
    steps:
      - name: Verify All Quality Gates Passed
        run: |
          if [ "${{ needs.web-quality.result }}" != "success" ]; then
            echo "❌ web-quality failed"
            exit 1
          fi
          if [ "${{ needs.web-tests.result }}" != "success" ]; then
            echo "❌ web-tests failed"
            exit 1
          fi
          if [ "${{ needs.mobile-android.result }}" != "success" ]; then
            echo "❌ mobile-android failed"
            exit 1
          fi
          if [ "${{ needs.mobile-ios.result }}" != "success" ]; then
            echo "❌ mobile-ios failed"
            exit 1
          fi
          echo "✅ All CI quality, security, and parity gates passed successfully!"

  # ── Production image ───────────────────────────────────────────────────────
  # Builds the image, boots it in the runner, and pushes it to GHCR. Runs on a
  # push to master, or on a manual run of any branch, after web-quality is
  # green. Every build moves `staging`, which the server deploys to
  # staging.novicetutor.com; only master moves `latest`. It does not deploy
  # production: the server
  # has no public SSH, so a deploy is run from the Mac in the infra repo with
  # `bin/prod deploy novicetutor <full commit sha>` (infra/docs/runbook.md).
  #
  # Repository variables:  IMAGE_PLATFORM (linux/amd64 default; linux/arm64 for
  #                        Hetzner CAX), IMAGE_RUNNER (optional),
  #                        NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_VAPID_PUBLIC_KEY
  image:
    name: Build & Push Image
    needs: [web-quality]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ${{ vars.IMAGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    concurrency:
      group: image-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/novice130/iqra-academy
      PLATFORM: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only does work when PLATFORM differs from the runner's architecture
      # (an arm64 image on the default amd64 runner). Emulated builds are slow;
      # set IMAGE_RUNNER to an arm64 runner label to avoid that.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Read by the staging updater on the server (infra
          # hetzner/sites/novicetutor-staging/update.sh).
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://novicetutor.com' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image that was just built, started the way compose starts it
      # (infra hetzner/sites/novicetutor/compose.yml): read-only root, the same
      # tmpfs mounts, no capabilities. Verifies both web and realtime processes
      # boot, connect to the database, listen and route.
      - name: Smoke-boot the image
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=user -e POSTGRES_PASSWORD=pass -e POSTGRES_DB=db \
            postgres:17-alpine
          common=(--network smoke --init --platform "$PLATFORM"
            --read-only --cap-drop ALL --security-opt no-new-privileges
            -e DATABASE_URL=postgresql://user:pass@smoke-db:5432/db
            -e BETTER_AUTH_SECRET=smoke-test-secret-not-used-anywhere-32chars
            -e REALTIME_SECRET=smoke-realtime-secret-32-chars-long-min
            -e NEXT_PUBLIC_APP_URL=http://localhost:3000)
          docker run -d --name web "${common[@]}" \
            --tmpfs /tmp:size=32m \
            --tmpfs /app/apps/web/.next/cache:uid=1000,gid=1000,size=48m \
            -e REALTIME_INTERNAL_URL=http://realtime:8787 \
            -p 127.0.0.1:3000:3000 "$IMAGE:$GITHUB_SHA"
          docker run -d --name realtime "${common[@]}" \
            --tmpfs /tmp:size=8m \
            -e APP_INTERNAL_URL=http://web:3000 \
            -p 127.0.0.1:8787:8787 "$IMAGE:$GITHUB_SHA" node realtime-server.mjs

          wait_for() {
            for _ in $(seq 1 40); do
              code=$(curl -s -o /tmp/smoke-body -w '%{http_code}' "$1" || true)
              if [ "$code" = "200" ]; then echo "OK $1"; cat /tmp/smoke-body; echo; return 0; fi
              sleep 3
            done
            echo "FAILED $1 (last status: ${code:-none})"
            return 1
          }
          wait_for http://127.0.0.1:8787/healthz
          wait_for http://127.0.0.1:3000/api/health
          wait_for http://127.0.0.1:3000/login
          # The path compose's healthcheck uses, with its test: any status
          # under 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/favicon.ico || true)
          echo "favicon.ico: ${code:-none}"
          if [ "${code:-000}" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi

          # The image must not run as root.
          test "$(docker exec web id -u)" != "0"

      - name: Smoke-boot logs
        if: failure()
        run: |
          docker logs web || true
          docker logs realtime || true

      # :staging is what staging.novicetutor.com runs: the server checks it every
      # five minutes and deploys it. Production moves only by a manual
      # `bin/prod deploy novicetutor <sha>` of a sha that has run on staging.
      - name: Push image (sha and staging, and latest from master)
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:staging"
          docker push "$IMAGE:staging"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
